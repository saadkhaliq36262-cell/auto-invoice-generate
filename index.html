<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoInvoice Pro — Multi-Company Invoicing SaaS Platform</title>
  
  <!-- Modern Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/style.css">

  <!-- PDF Rendering Library -->
  <script src="libs/html2pdf.bundle.min.js"></script>
</head>
<body class="saas-body">

  <!-- Main Multi-Company SaaS Wrapper -->
  <div class="saas-wrapper">
    
    <!-- Left Navigation Sidebar -->
    <aside class="saas-sidebar">
      
      <!-- App Brand Header -->
      <div class="sidebar-brand">
        <div class="brand-logo-icon">⚡</div>
        <div class="brand-text">
          <div class="brand-name">AutoInvoice Pro</div>
          <div class="brand-tagline">Multi-Company SaaS</div>
        </div>
      </div>

      <!-- Company Selector Dropdown -->
      <div class="sidebar-company-section" id="sidebarCompanySelector">
        <!-- Injected dynamically by js/components/companySelector.js -->
      </div>

      <!-- Primary Navigation Links -->
      <nav class="sidebar-nav">
        <div class="sidebar-nav-group-title">MAIN MENU</div>
        
        <a href="#dashboard" class="sidebar-nav-item active">
          <span class="nav-icon">📊</span>
          <span class="nav-label">Dashboard</span>
        </a>

        <a href="#invoices" class="sidebar-nav-item">
          <span class="nav-icon">📄</span>
          <span class="nav-label">Invoices</span>
        </a>

        <a href="#clients" class="sidebar-nav-item">
          <span class="nav-icon">👥</span>
          <span class="nav-label">Clients</span>
        </a>

        <a href="#templates" class="sidebar-nav-item">
          <span class="nav-icon">🎨</span>
          <span class="nav-label">Templates</span>
        </a>

        <a href="#mail" class="sidebar-nav-item">
          <span class="nav-icon">✉️</span>
          <span class="nav-label">Mail &amp; Replies</span>
        </a>

        <a href="#referrals" class="sidebar-nav-item">
          <span class="nav-icon">🎁</span>
          <span class="nav-label">Referrals</span>
        </a>

        <div class="sidebar-nav-group-title mt-3">CONFIGURATION</div>

        <a href="#settings" class="sidebar-nav-item">
          <span class="nav-icon">⚙️</span>
          <span class="nav-label">Settings</span>
        </a>

        <a href="#settings?tab=mcp" class="sidebar-nav-item mcp-nav-item">
          <span class="nav-icon">📡</span>
          <span class="nav-label">MCP Protocol</span>
          <span class="badge badge-accent-xs">35</span>
        </a>
      </nav>

      <!-- Sidebar Footer / Active Profile -->
      <div class="sidebar-footer">
        <div class="user-profile-widget">
          <div class="user-avatar">SK</div>
          <div class="user-details">
            <div class="user-name">Saad Khaliq</div>
            <div class="user-role">Platform Owner</div>
          </div>
        </div>
        <div class="mcp-live-pill" onclick="window.location.hash='#settings?tab=mcp'">
          <span class="mcp-dot"></span>
          <span>MCP Live at /mcp</span>
        </div>
      </div>

    </aside>

    <!-- Main Content Area -->
    <div class="saas-main">
      
      <!-- Top Bar -->
      <header class="saas-top-header">
        <div class="top-header-left">
          <div class="top-search-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" id="globalTopSearch" class="top-search-input" placeholder="Search invoices, clients, or templates... (Press Ctrl+K)" />
          </div>
        </div>

        <div class="top-header-right">
          <div class="demo-badge-wrap" title="Admin Unlimited Mode">
            <span class="badge badge-success text-xs">👑 Unlimited Developer Access</span>
          </div>
          
          <a href="#invoices/new" class="btn btn-primary btn-sm">
            ➕ New Invoice
          </a>
        </div>
      </header>

      <!-- SPA Dynamic View Container -->
      <main class="main-content" id="appView">
        <div class="view-loading">
          <div class="spinner"></div>
          <p>Loading AutoInvoice Pro...</p>
        </div>
      </main>

    </div>

  </div>

  <!-- Global Toast Notifications -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Application Modules -->
  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/components/companySelector.js"></script>
  <script src="js/components/assistant.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/invoices.js"></script>
  <script src="js/views/invoiceForm.js"></script>
  <script src="js/views/emailComposer.js"></script>
  <script src="js/views/templates.js"></script>
  <script src="js/views/designer.js"></script>
  <script src="js/views/pdfUpload.js"></script>
  <script src="js/views/clients.js"></script>
  <script src="js/views/mail.js"></script>
  <script src="js/views/referrals.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>

</body>
</html>
