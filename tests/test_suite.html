<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Automated Invoice Generator - Test Suite</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 2rem;
      line-height: 1.6;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
      background: #1e293b;
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      color: #60a5fa;
      margin-bottom: 0.5rem;
    }
    .summary {
      padding: 1rem;
      background: #334155;
      border-radius: 8px;
      margin-bottom: 1.5rem;
      font-size: 1.1rem;
      font-weight: bold;
    }
    .test-case {
      padding: 0.75rem 1rem;
      margin-bottom: 0.5rem;
      border-radius: 6px;
      background: #0f172a;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-left: 4px solid #64748b;
    }
    .test-case.pass {
      border-left-color: #22c55e;
    }
    .test-case.fail {
      border-left-color: #ef4444;
      background: #450a0a;
    }
    .badge {
      padding: 0.25rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 800;
    }
    .badge.pass { background: #166534; color: #86efac; }
    .badge.fail { background: #991b1b; color: #fca5a5; }
    .error-log {
      font-family: monospace;
      font-size: 0.8rem;
      color: #fca5a5;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🧪 Test Suite: Automated Invoice Generator</h1>
    <p style="color: #94a3b8; margin-bottom: 1rem;">Verifying Calculations, Raw Text Parser, PDF Filename Format, Email Drafts &amp; Demo Limits</p>
    
    <div id="summary" class="summary">Running tests...</div>
    <div id="results"></div>
  </div>

  <!-- Load Modules -->
  <script src="../js/demo.js"></script>
  <script src="../js/parser.js"></script>
  <script src="../js/invoice.js"></script>
  <script src="../js/email.js"></script>
  <script src="../js/storage.js"></script>

  <script>
    const resultsContainer = document.getElementById('results');
    const summaryContainer = document.getElementById('summary');
    let passed = 0;
    let failed = 0;

    function assert(description, condition, actualInfo = '') {
      const div = document.createElement('div');
      div.className = `test-case ${condition ? 'pass' : 'fail'}`;
      
      let html = `<div><strong>${description}</strong>`;
      if (!condition && actualInfo) {
        html += `<div class="error-log">${actualInfo}</div>`;
      }
      html += `</div><span class="badge ${condition ? 'pass' : 'fail'}">${condition ? 'PASS' : 'FAIL'}</span>`;
      div.innerHTML = html;
      resultsContainer.appendChild(div);

      if (condition) passed++;
      else failed++;
    }

    // --- TEST 1: Calculations ---
    const inv = new InvoiceModel({
      items: [
        { description: 'Item 1', quantity: 2, price: 1500.50 },
        { description: 'Item 2', quantity: 1, price: 400.00 }
      ],
      discount: { type: 'fixed', value: 100 },
      tax: { type: 'percentage', rate: 10 },
      shipping: 50
    });

    assert('Subtotal Calculation ($3,401.00)', inv.calculateSubtotal() === 3401, `Got: ${inv.calculateSubtotal()}`);
    assert('Fixed Discount Calculation ($100.00)', inv.calculateDiscountAmount() === 100, `Got: ${inv.calculateDiscountAmount()}`);
    assert('Taxable Net Amount ($3,301.00)', inv.calculateTaxableAmount() === 3301, `Got: ${inv.calculateTaxableAmount()}`);
    assert('Tax Amount ($330.10)', inv.calculateTaxAmount() === 330.1, `Got: ${inv.calculateTaxAmount()}`);
    assert('Grand Total Calculation ($3,681.10)', inv.calculateGrandTotal() === 3681.1, `Got: ${inv.calculateGrandTotal()}`);

    // Percentage Discount Test
    inv.discount = { type: 'percentage', value: 15 };
    assert('Percentage Discount (15% of $3,401 = $510.15)', Math.abs(inv.calculateDiscountAmount() - 510.15) < 0.001, `Got: ${inv.calculateDiscountAmount()}`);

    // --- TEST 2: Filename Generation ---
    inv.invoiceMeta.invoiceNumber = 'INV-0001';
    inv.customer.name = 'Ali Khan';
    assert('PDF Filename matches exact requirement: Invoice-INV-0001-Ali-Khan.pdf', inv.getFilename() === 'Invoice-INV-0001-Ali-Khan.pdf', `Got: ${inv.getFilename()}`);

    inv.invoiceMeta.invoiceNumber = 'INV # 2026/99';
    inv.customer.name = 'Dr. Jane Watson & Co.';
    const filename2 = inv.getFilename();
    assert(
      'Sanitizes special characters in filename safely',
      !filename2.includes('/') && !filename2.includes('&') && filename2.endsWith('.pdf'),
      `Got: ${filename2}`
    );

    // --- TEST 3: Email Draft Template ---
    inv.company.name = 'Nova Solutions';
    inv.customer.name = 'Ali Khan';
    inv.customer.email = 'ali.khan@example.com';
    inv.invoiceMeta.invoiceNumber = 'INV-0001';
    inv.invoiceMeta.invoiceDate = '2026-09-14';
    inv.invoiceMeta.dueDate = '2026-09-28';
    inv.discount = { type: 'fixed', value: 0 };
    inv.tax = { type: 'percentage', rate: 0 };
    inv.shipping = 0;
    inv.items = [{ description: 'Dev Service', quantity: 1, price: 1000 }];
    
    const draft = inv.generateEmailDraft();
    assert('Email Draft: Recipient is Customer email', draft.recipient === 'ali.khan@example.com', `Got: ${draft.recipient}`);
    assert('Email Draft: Subject is Invoice [Invoice Number] - [Company Name]', draft.subject === 'Invoice INV-0001 - Nova Solutions', `Got: ${draft.subject}`);
    assert('Email Draft: Body contains Invoice Number: INV-0001', draft.body.includes('Invoice Number: INV-0001'), `Body was: ${draft.body}`);
    assert('Email Draft: Body contains Invoice Date: 2026-09-14', draft.body.includes('Invoice Date: 2026-09-14'), `Body was: ${draft.body}`);
    assert('Email Draft: Body contains Amount Due: $1,000.00', draft.body.includes('Amount Due: $1,000.00'), `Body was: ${draft.body}`);
    assert('Email Draft: Body contains Due Date: 2026-09-28', draft.body.includes('Due Date: 2026-09-28'), `Body was: ${draft.body}`);
    assert('Email Draft: Body contains Thank you and Best regards', draft.body.includes('Thank you for your business.') && draft.body.includes('Best regards,\nNova Solutions'), `Body was: ${draft.body}`);

    const gmailUrl = EmailDraftManager.getGmailComposeUrl(draft);
    assert('Gmail URL: Uses official mail.google.com compose endpoint', gmailUrl.startsWith('https://mail.google.com/mail/?view=cm&fs=1'));
    assert('Gmail URL: Pre-fills recipient, subject and full draft body', gmailUrl.includes('to=ali.khan%40example.com') && gmailUrl.includes('su=Invoice%20INV-0001%20-%20Nova%20Solutions') && gmailUrl.includes('body=Dear%20Ali%20Khan'));

    // --- TEST 4: Raw Text Parser ---
    const sampleRaw = `
      Company: Apex Innovations
      Company Email: info@apexinnovations.com
      Company Phone: +1 (555) 234-5678
      Customer: Ali Khan
      Customer Email: ali.khan@example.com
      Invoice Number: INV-0001
      Invoice Date: 2026-09-14
      Due Date: 2026-09-28
      Payment Terms: Net 14
      
      Items:
      - Web App Development | Qty: 1 | Rate: $3500.00 | Tax: 10%
      - Cloud Infrastructure | Qty: 1 | Rate: $850.00

      Discount: $200
      Tax: 10%
      Notes: Payment due in 14 days
    `;

    const parsed = RawInvoiceParser.parse(sampleRaw);
    assert('Parser: Extracted company name', parsed.company.name === 'Apex Innovations', `Got: ${parsed.company?.name}`);
    assert('Parser: Extracted customer email', parsed.customer.email === 'ali.khan@example.com', `Got: ${parsed.customer?.email}`);
    assert('Parser: Extracted invoice number', parsed.invoiceMeta.invoiceNumber === 'INV-0001', `Got: ${parsed.invoiceMeta?.invoiceNumber}`);
    assert('Parser: Extracted 2 line items', parsed.items && parsed.items.length === 2, `Count: ${parsed.items?.length}`);
    assert('Parser: Extracted item 1 details', parsed.items[0]?.quantity === 1 && parsed.items[0]?.price === 3500, `Item 1: ${JSON.stringify(parsed.items[0])}`);
    assert('Parser: Extracted discount', parsed.discount?.value === 200, `Got: ${parsed.discount?.value}`);
    assert('Parser: Extracted tax rate', parsed.taxRate?.value === 10, `Got: ${parsed.taxRate?.value}`);

    // --- TEST 5: Storage Manager Sequential Numbering ---
    localStorage.clear();
    const next1 = StorageManager.getNextInvoiceNumber();
    assert('Storage: Default initial invoice number is INV-0001', next1 === 'INV-0001', `Got: ${next1}`);

    StorageManager.saveInvoice(new InvoiceModel({ invoiceMeta: { invoiceNumber: 'INV-0001' } }));
    const next2 = StorageManager.getNextInvoiceNumber();
    assert('Storage: Next sequential invoice number is INV-0002', next2 === 'INV-0002', `Got: ${next2}`);

    // --- TEST 6: Demo Limit & Developer Bypass Tests ---
    localStorage.clear();
    DemoManager.disableDevMode();

    assert('Demo: Initial usage count is 0', DemoManager.getUsageCount() === 0, `Got: ${DemoManager.getUsageCount()}`);
    assert('Demo: Limit not reached initially', DemoManager.isLimitReached() === false);

    DemoManager.incrementUsage();
    assert('Demo: Usage count is 1 after 1st generation', DemoManager.getUsageCount() === 1, `Got: ${DemoManager.getUsageCount()}`);
    assert('Demo: 1 invoice remaining', DemoManager.getRemainingCount() === 1);

    DemoManager.incrementUsage();
    assert('Demo: Usage count is 2 after 2nd generation', DemoManager.getUsageCount() === 2, `Got: ${DemoManager.getUsageCount()}`);
    assert('Demo: Limit IS reached after 2nd generation', DemoManager.isLimitReached() === true);

    DemoManager.enableDevMode();
    assert('Demo: Developer mode bypasses limit', DemoManager.isAdmin() === true && DemoManager.isLimitReached() === false);

    DemoManager.disableDevMode();
    assert('Demo: Visitor mode restored and limit blocked', DemoManager.isLimitReached() === true);

    // Update Summary
    summaryContainer.textContent = `Completed: ${passed + failed} Tests | ${passed} Passed | ${failed} Failed`;
    summaryContainer.style.background = failed === 0 ? '#166534' : '#991b1b';
  </script>
</body>
</html>
